[package]
name = "ruresol"
version = "0.6.4"
publish = false
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
hickory-resolver = { version = "0.26", features = ["system-config", "tokio",  "https-ring", "webpki-roots"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = { version = "0.18", features = ["improved_unicode"] }
rand = "0.10"
libc = "0.2"
ipnet = "2"

[profile.release]
opt-level = 3
debug = true
lto = false
